service: aws-python-flask-dynamodb-api

frameworkVersion: "4"

stages:
  default:
    params:
      tableName: "users-table-${sls:stage}"

plugins:
  - serverless-wsgi

custom:
  wsgi:
    app: app.app
    # serverless-wsgi decides whether to pip-install requirements itself by
    # checking for "serverless-python-requirements" in the plugins list; with
    # that plugin removed this must be pinned false so wsgi defers to the
    # built-in python requirements packaging (activated by custom.pythonRequirements below).
    packRequirements: false
  # Built-in python requirements packaging activates on this key.
  pythonRequirements: {}

provider:
  name: aws
  runtime: python3.14
  architecture: arm64
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
  environment:
    USERS_TABLE: ${param:tableName}

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TableName: ${param:tableName}
