service: compose-shared-orders-db

frameworkVersion: '4'

provider:
  name: aws

# A stateful, resource-only service: no functions, just the shared DynamoDB
# table. Its name is generated by CloudFormation (no fixed TableName), so the
# stack is safe to deploy to any account or stage without collisions. Other
# services read the generated name and ARN from these outputs.
resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
  Outputs:
    TableName:
      Value: !Ref OrdersTable
    TableArn:
      Value: !GetAtt OrdersTable.Arn
