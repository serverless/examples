service: aws-node-alexa-skill

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64

functions:
  luckyNumber:
    handler: handler.luckyNumber
    events:
      # Empty object: any Alexa skill may invoke this function.
      # Set `appId` to restrict invocation to a specific skill.
      - alexaSkill: {}
