service: aws-custom-authorizer-auth0

frameworkVersion: '4'

package:
  patterns:
    - '!node_modules/**'
    - '!frontend/**'
    - '!Makefile'
    - '!secrets.example.json'
    - '!public_key-example'

custom:
  # Built-in python requirements packaging activates on this key.
  # pipCmdExtraArgs forces pip to fetch Lambda-compatible (manylinux) wheels
  # for arm64, regardless of the host OS/architecture running the deploy.
  pythonRequirements:
    pipCmdExtraArgs:
      - --platform
      - manylinux2014_aarch64
      - '--only-binary=:all:'

provider:
  name: aws
  runtime: python3.14
  architecture: arm64
  region: us-east-1
  environment:
    AUTH0_CLIENT_ID: ${file(./secrets.json):AUTH0_CLIENT_ID, 'REPLACE-ME'}
    AUTH0_CLIENT_PUBLIC_KEY: ${file(./public_key), 'REPLACE-ME'}

functions:
  auth:
    handler: lambda_handlers.auth
  publicEndpoint:
    handler: lambda_handlers.public_endpoint
    events:
      - http:
          path: api/public
          method: post
          cors: true
  privateEndpoint:
    handler: lambda_handlers.private_endpoint
    events:
      - http:
          path: api/private
          method: post
          # See custom authorizer docs here: http://bit.ly/2gXw9pO
          authorizer: auth
          cors: true

resources:
  Resources:
    # This response is needed for custom authorizer failures cors support ¯\_(ツ)_/¯
    GatewayResponse:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: EXPIRED_TOKEN
        RestApiId:
          Ref: 'ApiGatewayRestApi'
        StatusCode: '401'
    AuthFailureGatewayResponse:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: 'ApiGatewayRestApi'
        StatusCode: '401'
