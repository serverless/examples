service: serverless-pymongo-item-api

frameworkVersion: '4'

package:
  patterns:
    - '!node_modules/**'

custom:
  # Built-in python requirements packaging activates on this key.
  pythonRequirements:
    # Download Linux arm64 wheels for Python 3.15 on any machine, so compiled
    # dependencies (such as pymongo) match the Lambda architecture and runtime.
    pipCmdExtraArgs:
      - '--platform=manylinux2014_aarch64'
      - '--platform=manylinux_2_28_aarch64'
      - '--python-version=3.15'
      - '--only-binary=:all:'

provider:
  name: aws
  runtime: python3.15
  architecture: arm64
  environment:
    MONGO_DB_USER: ${env:MONGO_DB_USER, ''}
    MONGO_DB_PASS: ${env:MONGO_DB_PASS, ''}
    MONGO_DB_NAME: ${env:MONGO_DB_NAME, ''}
    MONGO_DB_URL: ${env:MONGO_DB_URL, ''}
    MONGO_COLLECTION_NAME: ${env:MONGO_COLLECTION_NAME, ''}
  iam:
    role:
      managedPolicies:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

functions:
  create:
    handler: item/create.create
    events:
      - http:
          path: item
          method: post
          cors: true

  list:
    handler: item/list.list
    events:
      - http:
          path: item
          method: get
          cors: true

  get:
    handler: item/get.get
    events:
      - http:
          path: item/{id}
          method: get
          cors: true

  delete:
    handler: item/delete.delete
    events:
      - http:
          path: item/{id}
          method: delete
          cors: true
