# A Node.js Lambda function deployed as a container image with SnapStart.
# Deploying builds the image and pushes it to ECR, so Docker must be running.
service: aws-node-container-snapstart

provider:
  name: aws
  # SnapStart bills a cached snapshot per published version (outside the Java
  # managed runtimes). Deleting superseded versions on deploy keeps that to one.
  versionFunctions: false
  ecr:
    images:
      app:
        path: ./
        platform: linux/amd64

functions:
  hello:
    image: app
    snapStart: true
    events:
      - httpApi: GET /
