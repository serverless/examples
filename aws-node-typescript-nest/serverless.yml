service: serverless-nest-example

frameworkVersion: '4'

plugins:
  - serverless-offline

# @nestjs/core and @nestjs/common lazily `require()` a handful of optional
# peer packages (microservices/websockets transports, class-validator,
# class-transformer) that this example doesn't use and doesn't install.
# esbuild fails to resolve them at bundle time unless they're marked
# external, so they're left as runtime requires instead (never hit, since
# these code paths aren't exercised by a plain HTTP controller).
build:
  esbuild:
    configFile: ./esbuild.config.js
    external:
      - '@nestjs/microservices'
      - '@nestjs/websockets'
      - class-validator
      - class-transformer

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64

functions:
  main:
    handler: src/main.handler
    events:
      - http:
          method: any
          path: /{proxy+}
