service: aws-python-line-echo-bot
frameworkVersion: '4'

package:
  patterns:
    - '!node_modules/**'

provider:
  name: aws
  runtime: python3.15
  architecture: arm64
  environment:
    CHANNEL_ACCESS_TOKEN: ${env:CHANNEL_ACCESS_TOKEN, 'YOUR_CHANNEL_ACCESS_TOKEN'}
    CHANNEL_SECRET: ${env:CHANNEL_SECRET, 'YOUR_CHANNEL_SECRET'}

functions:
  line_bot:
    handler: handler.webhook
    events:
      - http:
          path: /webhook
          method: POST

custom:
  # Built-in python requirements packaging activates on this key.
  pythonRequirements:
    # Download Linux arm64 wheels for Python 3.15 on any machine, so compiled
    # dependencies (such as pydantic-core) match the Lambda architecture and runtime.
    pipCmdExtraArgs:
      - '--platform=manylinux2014_aarch64'
      - '--platform=manylinux_2_28_aarch64'
      - '--python-version=3.15'
      - '--only-binary=:all:'
