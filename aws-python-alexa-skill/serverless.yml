service: aws-python-alexa-skill

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.14
  architecture: arm64

functions:
  luckyNumber:
    handler: handler.lucky_number
    events:
      # Replace with your own skill ID from the Amazon Developer Console.
      - alexaSkill: amzn1.ask.skill.xx-xx-xx-xx-xx
