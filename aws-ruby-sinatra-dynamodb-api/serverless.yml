service: aws-ruby-sinatra-dynamodb-api

frameworkVersion: '4'

custom:
  tableName: "users-table-${self:provider.stage}"
  rack:
    # bin/bundle-compat configures the gem install path via
    # `bundle config set --local` and excludes local-development gems
    # (puma, rackup) from the deployed package.
    bundlerBin: ./bin/bundle-compat
    bundlerArgs: '--without development'

provider:
  name: aws
  runtime: ruby4.0
  architecture: arm64
  apiGateway:
    shouldStartNameWithService: true
  stage: dev
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
  environment:
    USERS_TABLE: ${self:custom.tableName}

functions:
  api:
    handler: rack_adapter.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY

plugins:
  - serverless-rack

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TableName: ${self:custom.tableName}
