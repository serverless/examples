# LangGraph JS Example
#
# A minimal LangGraph JavaScript agent for AWS Bedrock AgentCore.
# The container image is built automatically from source code.

service: langgraph-basic

frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1

ai:
  agents:
    # Runtime agent - no Dockerfile needed, image built from source automatically
    assistant: {}
