# LangGraph JS Streaming Example
#
# A LangGraph JavaScript agent with real-time LLM token streaming.
# The container image is built automatically from source code.

service: langgraph-streaming

frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1

ai:
  agents:
    # Runtime agent - no Dockerfile needed, image built from source automatically
    assistant: {}
