service: aws-python-scheduled-cron

frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.15
  architecture: arm64

functions:
  rateHandler:
    handler: handler.run
    events:
      - schedule: rate(1 minute)
  cronHandler:
    handler: handler.cron
    events:
      - schedule:
          method: scheduler
          rate: cron(0 9 ? * MON-FRI *)
          timezone: America/New_York
