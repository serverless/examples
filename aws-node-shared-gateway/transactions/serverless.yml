service: eshop-transactions

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ap-southeast-1
  apiGateway:
    restApiId:
      "Fn::ImportValue": SharedGW-restApiId
    restApiRootResourceId:
      "Fn::ImportValue": SharedGW-rootResourceId

functions:
  get-transactions:
    handler: handler.getTransactions
    events:
      - http:
          path: transactions/list
          method: get
