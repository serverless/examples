service: scrapper-lambda

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  # @sparticuz/chromium only ships x86_64 Chromium binaries (no arm64 build), so this
  # example is a documented exception to the repo-wide arm64 default.
  architecture: x86_64

plugins:
  - serverless-offline

functions:
  hello:
    handler: handler.hello
    memorySize: 1536
    timeout: 29
    events:
      - http:
          path: /
          method: get
