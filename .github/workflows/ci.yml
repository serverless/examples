name: ci

# Static checks for every pull request and push; live tests (deploy, check,
# remove) for the examples a change touches, on pushes to v4 and on pull
# requests from branches of this repository. Pull requests from forks run the
# static checks only.

on:
  pull_request:
  push:
    branches: [v4]

permissions: {}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test the scripts
        run: npm test
      - name: Validate the examples
        run: npm run validate
      - name: Check the generated docs
        run: npm run check-docs

  select:
    name: Select changed examples
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Select
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push that creates the branch has no previous commit; compare with the parent.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD~1; fi
          node scripts/select-examples.mjs --changed "$BASE_SHA" > "$RUNNER_TEMP/selection.json"
          # shellcheck disable=SC2016 # single quotes on purpose: the ${...} below are JavaScript
          node --input-type=module -e '
            import fs from "node:fs";
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            // index picks the role (index % 3); slug names files and artifacts.
            const include = s.dirs.map((dir, index) => ({ dir, index, role: (index % 3) + 1, slug: dir.replaceAll("/", "__") }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\ncount=${include.length}\n`);
            const lines = ["## Selected examples", "", s.reason, ""];
            for (const d of s.dirs) lines.push(`- ${d}`);
            if (s.quarantined.length) {
              lines.push("", "Quarantined, not run:", "");
              for (const d of s.quarantined) lines.push(`- ${d}`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          ' "$RUNNER_TEMP/selection.json"

  live:
    name: Live test (${{ matrix.dir }})
    needs: select
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
    # One group per example, shared with the sweep: two runs of one example never overlap.
    concurrency:
      group: live-${{ matrix.dir }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      EXAMPLE_DIR: ${{ matrix.dir }}
      EXAMPLE_SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the Serverless Framework CLI
        run: npm install --global serverless
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role == 1 && vars.EXAMPLES_ROLE_ARN_1 || matrix.role == 2 && vars.EXAMPLES_ROLE_ARN_2 || vars.EXAMPLES_ROLE_ARN_3 }}
          aws-region: ${{ vars.EXAMPLES_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Choose the stage
        id: stage
        run: |
          stage=$(node --input-type=module -e 'import { newStage } from "./scripts/test-example.mjs"; console.log(newStage())')
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Stage: $stage"
      # The region is AWS_REGION from the step above, unless the manifest sets one.
      - name: Test with latest
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
          SERVERLESS_PLATFORM_STAGE: dev
        run: |
          node scripts/test-example.mjs "$EXAMPLE_DIR" --stage "$STAGE" --framework-version latest \
            --result-file "results/$EXAMPLE_SLUG--latest.json"
      - name: Upload the latest result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.slug }}--latest-${{ github.run_attempt }}
          path: results/${{ matrix.slug }}--latest.json
          if-no-files-found: warn
          retention-days: 30
      # A cancelled or timed-out job gives the runner only seconds to remove;
      # this step removes whatever the stage still has.
      - name: Remove what the stage left
        if: always() && steps.stage.outputs.stage != ''
        timeout-minutes: 15
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
          SERVERLESS_PLATFORM_STAGE: dev
        run: node scripts/test-example.mjs "$EXAMPLE_DIR" --remove-only --stage "$STAGE"
