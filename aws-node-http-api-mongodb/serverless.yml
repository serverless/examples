service: serverless-http-api-mongodb
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  httpApi:
    cors: true

functions:
  createUser:
    handler: handler.createUser
    events:
      - httpApi:
          path: /user
          method: post

  updateUser:
    handler: handler.updateUser
    events:
      - httpApi:
          path: /user/{id}
          method: put

  deleteUser:
    handler: handler.deleteUser
    events:
      - httpApi:
          path: /user/{id}
          method: delete

  user:
    handler: handler.user
    events:
      - httpApi:
          path: /user/{id}
          method: get
