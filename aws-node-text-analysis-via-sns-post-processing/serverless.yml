service: text-analysis-sns

frameworkVersion: '4'

custom:
  # The stage in the name lets two stages of this service share an account.
  topicName: ${self:service}-${sls:stage}-notes
  topicArn: arn:aws:sns:${aws:region}:${aws:accountId}:${self:custom.topicName}

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  iam:
    role:
      statements:
        # addNote may publish to this service's topic and nothing else.
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: ${self:custom.topicArn}

functions:
  addNote:
    handler: handler.addNote
    environment:
      TOPIC_ARN: ${self:custom.topicArn}
    events:
      - httpApi:
          path: /notes
          method: post

  analyzeNote:
    handler: handler.analyzeNote
    events:
      # Creates the topic and subscribes this function to it.
      - sns:
          topicName: ${self:custom.topicName}
