service: serverless-gong

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  environment:
    GITHUB_WEBHOOK_SECRET: REPLACE-WITH-YOUR-SECRET-HERE
    SLACK_WEBHOOK_URL: REPLACE-WITH-YOUR-SLACK-WEBHOOK-URL-HERE

functions:
  handleGong:
    handler: handler.gongHandler
    events:
      - http:
          path: webhook
          method: post
