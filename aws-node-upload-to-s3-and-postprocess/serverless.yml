service: s3-postprocess

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  iam:
    role:
      statements:
        # Read what arrives under uploads/ and write results under processed/.
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource: arn:aws:s3:::${self:custom.bucket}/uploads/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource: arn:aws:s3:::${self:custom.bucket}/processed/*

custom:
  # Bucket names are global: the stage and the account ID keep this one unique.
  bucket: upload-postprocess-${sls:stage}-${aws:accountId}

functions:
  postprocess:
    handler: handler.postprocess
    environment:
      OUTPUT_PREFIX: processed/
    events:
      - s3:
          bucket: ${self:custom.bucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: uploads/

resources:
  Outputs:
    UploadBucketName:
      Description: The bucket to upload files to, under uploads/
      Value: ${self:custom.bucket}
