AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 3
    MemorySize: 128

Resources:
  # The function's log group is part of the stack, so removing the service
  # deletes it together with its logs. Without this, Lambda creates the log
  # group on the first invoke, outside the stack, and it stays after the
  # service is removed.
  HelloWorldLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-hello

  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Runtime: nodejs24.x
      LoggingConfig:
        LogGroup: !Ref HelloWorldLogGroup
      Environment:
        Variables:
          # We are using the output of the shared resources CloudFormation template
          # that is passed down from Serverless Compose, and the staged param "domain".
          TABLE_NAME: ${param:tableName}
          DOMAIN: ${param:domain}
      Architectures:
        - arm64
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /
            Method: GET

Outputs:
  Endpoint:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
