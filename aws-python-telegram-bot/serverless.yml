service: serverless-telegram-bot

frameworkVersion: '4'

package:
  patterns:
    - '!node_modules/**'

provider:
  name: aws
  runtime: python3.14
  architecture: arm64
  environment:
    TELEGRAM_TOKEN: ${file(./serverless.env.yml):TELEGRAM_TOKEN, ''}

functions:
  webhook:
    handler: handler.webhook
    events:
      - http: POST /

  set_webhook:
    handler: handler.set_webhook
    events:
      - http: POST /set_webhook

custom:
  # Built-in python requirements packaging activates on this key.
  pythonRequirements: {}
