service: aws-node-signed-uploads

frameworkVersion: '4'

plugins:
  - serverless-offline

custom:
  bucketName: ${self:service}-${sls:stage}-${aws:accountId}
  serverless-offline:
    port: 4000

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  stage: ${opt:stage, env:AWS_STAGE, 'dev'}
  region: ${opt:region, env:AWS_REGION, 'eu-central-1'}
  environment:
    REGION: ${self:provider.region}
    BUCKET: { Ref: Uploads }
  versionFunctions: false
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "s3:*"
          Resource: "*"

functions:
  upsert-objects:
    handler: src/upload.handler
    name: ${self:provider.stage}-${self:service}-upload
    memorySize: 128
    events:
      - http:
          path: upload
          method: get
          cors: true

resources:
  Resources:
    Uploads:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "Authorization"
              AllowedMethods:
                - GET
              AllowedOrigins:
                - "*"
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - PUT
              AllowedOrigins:
                - "*"
